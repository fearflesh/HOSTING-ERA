# Render Blueprint — deploy as a *Web Service* (the panel serves /healthz on $PORT
# while the Telegram bot long-polls in the background).
services:
  - type: web
    name: bot-hosting-panel
    runtime: python
    plan: free                  # free = ephemeral disk (state restored from the GitHub backup on boot)
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN          # main panel bot token from @BotFather
        sync: false
      - key: OWNER_ID           # your numeric Telegram user id (required)
        sync: false
      - key: GITHUB_TOKEN       # PRIVATE-repo token — needed to survive redeploys on the free plan
        sync: false
      - key: GITHUB_REPO        # e.g. yourname/panel-backup  (private repo)
        sync: false
      - key: GITHUB_KEY_REPO    # e.g. yourname/panel-keys    (separate private repo, recommended)
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: SUPPORT_GROUP      # optional: support group invite link (or set later with /setsupportgroup <link>)
        sync: false
      - key: UPDATE_CHANNEL     # optional: updates channel link (default https://t.me/Fsh_bots)
        sync: false
      - key: ANTHROPIC_API_KEY  # AI code scanner (any ONE of these keys enables it)
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SELF_PING          # keeps a free instance awake; set 0 if you use an external pinger
        value: "1"
    # ── Paid plan with a persistent disk: uncomment, then no GitHub backup is needed ──
    # disk:
    #   name: panel-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (and add env var  DATA_DIR=/var/data )
