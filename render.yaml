# Render Blueprint — deploy as a *Web Service* (the panel serves /healthz on $PORT
# while the Telegram bot long-polls in the background).
services:
  - type: web
    name: bot-hosting-panel
    runtime: python
    plan: free                  # free = ephemeral disk (state is restored from MongoDB on every boot)
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN          # main panel bot token from @BotFather
        sync: false
      - key: OWNER_ID           # your numeric Telegram user id (required)
        sync: false
      - key: MONGO_URL          # MongoDB Atlas connection string (mongodb+srv://...) — keeps ALL data across restarts
        sync: false
      - key: PERSIST_SECRET     # long random text; encrypts everything stored in MongoDB. KEEP A COPY — lose it and the data is unreadable
        sync: false
      - key: MONGO_DB
        value: fsh_panel
      - key: GITHUB_TOKEN       # PRIVATE-repo token — needed to survive redeploys on the free plan
        sync: false
      - key: GITHUB_REPO        # e.g. yourname/panel-backup  (private repo)
        sync: false
      - key: GITHUB_KEY_REPO    # e.g. yourname/panel-keys    (separate private repo, recommended)
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: SUPPORT_GROUP      # optional: support group invite link (or set later with /setsupportgroup <link>)
        sync: false
      - key: UPDATE_CHANNEL     # optional: updates channel link (default https://t.me/Fsh_bots)
        sync: false
      - key: ANTHROPIC_API_KEY  # AI code scanner (any ONE of these keys enables it)
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SELF_PING          # keeps a free instance awake; set 0 if you use an external pinger
        value: "1"
      # ── optional: two panels sharing one database ──
      # PANEL_ID                  defaults to RENDER_SERVICE_ID (unique per service). Set it to override.
      # SECOND_BOT_USERNAME       the other panel's bot username (no @): new users are sent there when busy
      # OVERLOAD_RSS_MB           panel RAM (MB) that counts as busy (default 350)
      # OVERLOAD_RUNNING_BOTS     optional count of running bots that counts as busy (0 = off)
      # JANITOR_LIMIT_MB          memory/disk cleanup threshold (default 400, 0 = off)
      # PERSIST_SECRET must be the SAME on both panels, or one cannot read the other's data.
    # ── Paid plan with a persistent disk: uncomment, then no GitHub backup is needed ──
    # disk:
    #   name: panel-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (and add env var  DATA_DIR=/var/data )
